name: Daily Market Briefing

on:
  schedule:
    # GitHub Actions의 최소 예약 간격인 5분마다 실행합니다.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "테스트용 기준일 (YYYY-MM-DD, 예: 2025-02-14)"
        required: false
        type: string

concurrency:
  group: daily-market-briefing
  cancel-in-progress: false

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Keep local development and Actions on the same Python line.
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Generate previous-day market briefing HTML
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            echo "Run with target date: $TARGET_DATE"
            daily-finance-briefing generate --report-date "$TARGET_DATE"
          else
            daily-finance-briefing generate
          fi

      - name: Commit generated HTML (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git add --force output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily market briefing html"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  deploy-pages:
    needs: generate-briefing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
