name: Daily market summary

on:
  schedule:
    # 매일 한국 표준시 오전 10시(UTC 01:00)에 실행합니다.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "보고서 기준일 (YYYY-MM-DD, 비워두면 오늘)"
        required: false
        type: string

concurrency:
  group: daily-market-summary
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    # Pin the runner image so an ubuntu-latest migration cannot change the
    # build environment without an explicit update here.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .[test]
      - name: Test
        run: pytest -q
      - name: Generate report
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          args=()
          if [[ -n "$REPORT_DATE" ]]; then args+=(--report-date "$REPORT_DATE"); fi
          daily-finance-briefing generate "${args[@]}"
      - name: Save collected data and generated HTML
        # 저장 로직은 한 개의 run 항목만 사용합니다. 실제 명령은 별도 스크립트에 둡니다.
        shell: bash
        run: ./scripts/save-generated-output.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
