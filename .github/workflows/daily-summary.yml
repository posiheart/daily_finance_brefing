name: Daily market summary

on:
  schedule:
    # 한국 표준시 10:07. 정각의 예약 실행 혼잡을 피합니다.
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "보고서 기준일 (YYYY-MM-DD, 비워두면 오늘)"
        required: false
        type: string

concurrency:
  group: daily-market-summary
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .[test]
      - name: Test
        run: pytest -q
      - name: Generate report
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          args=()
          if [[ -n "$REPORT_DATE" ]]; then args+=(--report-date "$REPORT_DATE"); fi
          daily-finance-briefing generate "${args[@]}"
      - name: Save collected data
        run: |
          if [[ -n "$(git status --porcelain -- data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "data: add daily market summary"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
