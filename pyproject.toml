[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-finance-briefing"
version = "0.1.0"
description = "FinanceDataReader 기반 일일 시장 요약 생성기"
requires-python = ">=3.11"
dependencies = [
  "finance-datareader>=0.9.96,<1",
  "Jinja2>=3.1,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
daily-finance-briefing = "daily_finance_briefing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_finance_briefing = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
